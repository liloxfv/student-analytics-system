<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارنامه | سامانه تحلیل عملکرد دانش‌آموزان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4f7cf0; --primary-dark:#3a63d4; --primary-soft:#eef3ff;
  --bg:#f7f9fc; --card:#fff; --ink:#1f2a3d; --muted:#7a869a; --line:#e6ebf2;
  --great:#2fa37a; --good:#7bb661; --ok:#e8a93a; --low:#e5566d;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  font-family:"Vazirmatn",Tahoma,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:240px 1fr;min-height:100vh;line-height:1.7}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #b9ccfb;outline-offset:2px}

/* sidebar */
.side{background:#fff;border-left:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;background:var(--primary);color:#fff;border-radius:12px;font-weight:800;font-size:1.1rem}
.brand strong{display:block;font-size:1.2rem;line-height:1.2}
.brand small{color:var(--muted);font-size:.7rem;direction:ltr;display:block;text-align:right}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{background:none;border:0;text-align:right;padding:10px 14px;border-radius:10px;cursor:pointer;color:#5b667a}
#nav button:hover{background:#f3f6fb}
#nav button.on{background:var(--primary-soft);color:var(--primary-dark);font-weight:700}
.side-note{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 6px}

main{padding:30px 36px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
h1{margin:0;font-size:1.6rem;font-weight:800}
.today{color:var(--muted);font-size:.88rem}
h2{font-size:1rem;margin:0 0 14px;font-weight:700}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
.mt{margin-top:18px}

.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.strip>div{padding:20px 24px;border-left:1px solid var(--line)}
.strip>div:last-child{border-left:0}
.strip span{color:var(--muted);font-size:.84rem}
.strip b{display:block;font-size:2rem;line-height:1.4;font-weight:800;color:var(--ink)}
.strip em{font-style:normal;font-size:.78rem;color:var(--muted)}

/* soft score chips */
.chip{display:inline-block;min-width:3.2em;text-align:center;padding:1px 10px;border-radius:99px;font-weight:700;font-size:.86rem}
.chip.great{background:#e2f5ec;color:#1b7a58}
.chip.good{background:#eaf5e1;color:#4b7f35}
.chip.ok{background:#fdf1d9;color:#9a6a0c}
.chip.low{background:#fde6ea;color:#b5304a}
.chip.none{background:#eef1f5;color:#8a95a7}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--muted);font-size:.8rem;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#f8faff}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
input,select{background:#fff;border:1px solid #d9e0ea;border-radius:10px;padding:8px 12px;min-width:0}
input:focus,select:focus{border-color:var(--primary);outline:3px solid #dbe6fd}
.btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #d9e0ea;font-weight:500}
.btn.ghost:hover{background:#f5f7fb}
.btn.danger{background:#fff;color:var(--low);border:1px solid #f4cbd2;font-weight:500}
.btn.danger:hover{background:#fff5f6}
.btn.sm{padding:3px 11px;font-size:.8rem}
.spacer{flex:1}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f0f3f8}
.rows li:last-child{border:0}
.rows a{color:var(--primary-dark);text-decoration:none;font-weight:500}
.rows a:hover{text-decoration:underline}
.meter{flex:1;height:8px;background:#eef1f6;border-radius:9px;overflow:hidden;margin:0 8px}
.meter i{display:block;height:100%;border-radius:9px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.chartbox{position:relative;height:260px}
.note{font-size:.82rem;color:#5b667a;background:var(--primary-soft);border-radius:10px;padding:10px 14px}

.seg{display:inline-flex;border:1px solid #d9e0ea;border-radius:10px;overflow:hidden}
.seg label{flex-direction:row;padding:5px 16px;cursor:pointer;color:var(--ink);font-size:.86rem;border-left:1px solid #d9e0ea}
.seg label:last-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){font-weight:700}
.seg label.p:has(input:checked){background:#e2f5ec;color:#1b7a58}
.seg label.l:has(input:checked){background:#fdf1d9;color:#9a6a0c}
.seg label.a:has(input:checked){background:#fde6ea;color:#b5304a}
.seg label:has(input:focus-visible){outline:3px solid #b9ccfb;outline-offset:-3px}

dialog{border:0;border-radius:18px;padding:0;width:min(720px,94vw);max-height:92vh;box-shadow:0 24px 70px rgba(16,24,40,.25)}
dialog::backdrop{background:rgba(31,42,61,.4);backdrop-filter:blur(2px)}
.dlg{padding:24px 28px 28px}
.dlg-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:16px}
.dlg-head h2{font-size:1.25rem;margin:0}
.dlg-head small{color:var(--muted)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid .full{grid-column:1/-1}
.actions{display:flex;gap:8px;margin-top:20px}
.insights{margin:8px 0 0;padding-right:20px}
.insights li{margin-bottom:5px}
#toast{position:fixed;bottom:22px;left:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:80vw}
#toast.show{opacity:1;transform:none}
#toast.err{background:var(--low)}

@media (max-width:900px){
  body{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:10px;border-left:0;border-bottom:1px solid var(--line)}
  #nav{flex-direction:row;flex-wrap:wrap}
  #nav button{padding:6px 12px}
  .side-note{display:none}
  main{padding:20px 14px 50px}
  .g2,.g3{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr 1fr}
  .strip>div{border-bottom:1px solid var(--line)}
  .formgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<aside class="side">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">۲۰</span>
    <div><strong>کارنامه</strong><small>Student Analytics System</small></div>
  </div>
  <nav id="nav">
    <button data-view="dashboard" class="on">داشبورد</button>
    <button data-view="students">دانش‌آموزان</button>
    <button data-view="grades">نمرات</button>
    <button data-view="attendance">حضور و غیاب</button>
  </nav>
  <div class="side-tools">
    <small>اطلاعات فقط روی همین مرورگر ذخیره می‌شود.</small>
    <button id="reseed">بازگشت به داده نمونه</button>
    <button id="wipe">شروع با لیست خالی</button>
  </div>
  <p class="side-note">نمرات از ۲۰ ثبت می‌شوند؛ نمره قبولی ۱۰ است.</p>
</aside>
<main>
  <header class="top">
    <h1 id="title">داشبورد</h1>
    <span class="today" id="today"></span>
  </header>
  <section id="view" aria-live="polite"></section>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
/* ===== In-browser data layer: replaces the server, data is kept in localStorage ===== */
const DB_KEY = "karnameh_v1";
const MIN_TREND = 3, THRESH = 0.4, PASS = 10;
const clampN = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const r2 = (x) => (x == null ? null : Math.round(x * 100) / 100);
const r1 = (x) => (x == null ? null : Math.round(x * 10) / 10);
const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
const isoDay = (off = 0) => { const d = new Date(); d.setDate(d.getDate() - off); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const emptyDB = () => ({ students: [], subjects: [], grades: [], attendance: [], next: { s: 1, sub: 1, g: 1, a: 1 } });

function seedData() {
  let seed = 42;
  const r = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const FIRST = ["علی", "سارا", "محمد", "زهرا", "رضا", "مریم", "امیر", "نگار", "حسین", "الهام", "پارسا", "فاطمه", "کیان", "ترانه", "آرین", "هانیه"];
  const LAST = ["احمدی", "رضایی", "موسوی", "کریمی", "حسینی", "نوری", "صادقی", "جلالی", "فرهادی", "کاظمی", "یوسفی", "مرادی"];
  const CLASSES = [["دهم", "۱۰-الف"], ["دهم", "۱۰-ب"], ["یازدهم", "۱۱-الف"]];
  const db = emptyDB();
  ["ریاضی", "فیزیک", "برنامه‌نویسی", "شبکه", "زبان انگلیسی", "ادبیات"].forEach((name) => db.subjects.push({ id: db.next.sub++, name }));
  const combos = FIRST.flatMap((f) => LAST.map((l) => [f, l]));
  for (let i = combos.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [combos[i], combos[j]] = [combos[j], combos[i]]; }
  combos.slice(0, 24).forEach(([f, l], i) => {
    const [lv, cl] = CLASSES[i % 3];
    db.students.push({ id: db.next.s++, student_code: "S" + (1001 + i), first_name: f, last_name: l, grade_level: lv, class_name: cl });
  });
  const exams = [5, 4, 3, 2, 1, 0].map((k) => isoDay(7 * k));
  db.students.forEach((s) => db.subjects.forEach((sub) => {
    const base = clampN(14 + 3 * gauss(), 6, 19), drift = (r() - 0.5) * 1.6;
    exams.forEach((d, i) => db.grades.push({ id: db.next.g++, student_id: s.id, subject_id: sub.id, score: Math.round(clampN(base + drift * i + gauss(), 0, 20) * 4) / 4, exam_date: d, title: "آزمون " + (i + 1) }));
  }));
  const days = [];
  for (let k = 0; k < 20 && days.length < 12; k++) { const d = new Date(); d.setDate(d.getDate() - k); if (d.getDay() !== 4 && d.getDay() !== 5) days.push(isoDay(k)); }
  db.students.forEach((s) => {
    const skip = [0.03, 0.08, 0.2][Math.floor(r() * 3)];
    days.forEach((d) => { const x = r(); db.attendance.push({ id: db.next.a++, student_id: s.id, day: d, status: x < skip ? "absent" : x < skip + 0.06 ? "late" : "present" }); });
  });
  return db;
}

let DB = (() => { try { const d = JSON.parse(localStorage.getItem(DB_KEY)); if (d && d.students && d.next) return d; } catch {} return seedData(); })();
const saveDB = () => { try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch {} };
const bad = (m) => { throw new Error(m); };
const fa = (a, b) => String(a).localeCompare(String(b), "fa");

const clean = (o, keys) => { const r = {}; for (const k of keys) { const v = String(o[k] ?? "").trim(); if (!v) bad("همه فیلدها الزامی است."); r[k] = v; } return r; };
const STU = ["student_code", "first_name", "last_name", "grade_level", "class_name"];
const fullName = (s) => s.first_name + " " + s.last_name;
const stuAvg = (id) => mean(DB.grades.filter((g) => g.student_id === id).map((g) => g.score));
const getStu = (id) => DB.students.find((s) => s.id === +id) || bad("دانش‌آموز پیدا نشد.");
const stuOut = (s) => ({ ...s, average: r2(stuAvg(s.id)) });

function attStats(sid) {
  const c = { present: 0, late: 0, absent: 0 };
  DB.attendance.forEach((a) => { if (sid == null || a.student_id === sid) c[a.status]++; });
  const total = c.present + c.late + c.absent;
  return { ...c, total, rate: total ? r1(((c.present + c.late) / total) * 100) : null };
}

function summary() {
  const withAvg = DB.students.map((s) => ({ s, a: stuAvg(s.id) })).filter((x) => x.a != null);
  const buckets = [["زیر ۱۰", 0, 10], ["۱۰ تا ۱۴", 10, 14], ["۱۴ تا ۱۷", 14, 17], ["۱۷ تا ۲۰", 17, 20.01]];
  const byKey = (arr, key) => arr.reduce((m, x) => ((m[key(x)] ||= []).push(x), m), {});
  const classes = byKey(DB.students, (s) => s.class_name);
  const dates = byKey(DB.grades, (g) => g.exam_date);
  return {
    students: DB.students.length, subjects: DB.subjects.length, grades: DB.grades.length,
    average: r2(mean(DB.grades.map((g) => g.score))),
    attendance: attStats(),
    subject_averages: DB.subjects.map((sub) => { const sc = DB.grades.filter((g) => g.subject_id === sub.id).map((g) => g.score); return sc.length ? { name: sub.name, average: r2(mean(sc)), count: sc.length } : null; }).filter(Boolean).sort((a, b) => b.average - a.average),
    class_averages: Object.entries(classes).map(([cn, ss]) => { const ids = new Set(ss.map((s) => s.id)); const g = DB.grades.filter((x) => ids.has(x.student_id)); return g.length ? { class_name: cn, average: r2(mean(g.map((x) => x.score))), students: new Set(g.map((x) => x.student_id)).size } : null; }).filter(Boolean),
    distribution: buckets.map(([label, lo, hi]) => ({ label, count: withAvg.filter((x) => x.a >= lo && x.a < hi).length })),
    timeline: Object.keys(dates).sort().map((d) => ({ date: d, average: r2(mean(dates[d].map((g) => g.score))) })),
    attention: withAvg.filter((x) => x.a < 12).sort((a, b) => a.a - b.a).slice(0, 5).map((x) => ({ id: x.s.id, name: fullName(x.s), class_name: x.s.class_name, average: r2(x.a) })),
  };
}

function slope(v) {
  const n = v.length, mx = (n - 1) / 2, my = mean(v);
  return v.reduce((s, y, i) => s + (i - mx) * (y - my), 0) / v.reduce((s, _, i) => s + (i - mx) ** 2, 0);
}

function report(s) {
  const gs = DB.grades.filter((g) => g.student_id === s.id).sort((a, b) => a.exam_date.localeCompare(b.exam_date) || a.id - b.id);
  const map = {};
  gs.forEach((g) => { (map[g.subject_id] ||= { subject_id: g.subject_id, name: DB.subjects.find((x) => x.id === g.subject_id).name, points: [] }).points.push({ date: g.exam_date, score: g.score }); });
  const subjects = [], insights = [];
  Object.values(map).forEach((x) => {
    const sc = x.points.map((p) => p.score);
    let dir = "insufficient";
    if (sc.length >= MIN_TREND) {
      const sl = slope(sc);
      dir = sl >= THRESH ? "up" : sl <= -THRESH ? "down" : "flat";
      if (dir === "up") insights.push(`در «${x.name}» روند نمرات رو به بهبود است (حدود ${Math.abs(sl).toFixed(1)} نمره در هر آزمون).`);
      if (dir === "down") insights.push(`در «${x.name}» روند نمرات کاهشی است (حدود ${Math.abs(sl).toFixed(1)} نمره در هر آزمون)؛ بهتر است بررسی شود.`);
    }
    subjects.push({ ...x, average: r2(mean(sc)), count: sc.length, direction: dir });
  });
  const enough = subjects.filter((x) => x.count >= MIN_TREND);
  enough.forEach((x) => { if (x.average < PASS) insights.push(`میانگین «${x.name}» زیر ${PASS} است و این درس به تمرین بیشتر نیاز دارد.`); });
  if (enough.length >= 2) {
    const best = enough.reduce((a, b) => (b.average > a.average ? b : a)), worst = enough.reduce((a, b) => (b.average < a.average ? b : a));
    if (best.average - worst.average >= 4) insights.push(`عملکرد در «${best.name}» (${best.average}) به‌طور محسوسی بالاتر از «${worst.name}» (${worst.average}) است.`);
  }
  if (gs.length && !enough.length) insights.push(`برای تحلیل روند، حداقل ${MIN_TREND} نمره در هر درس لازم است.`);
  const att = attStats(s.id);
  if (att.rate != null && att.rate < 85) insights.push(`درصد حضور (${att.rate}٪) پایین است.`);
  const byDate = {};
  gs.forEach((g) => (byDate[g.exam_date] ||= []).push(g.score));
  return {
    student: { id: s.id, student_code: s.student_code, name: fullName(s), grade_level: s.grade_level, class_name: s.class_name },
    average: r2(mean(gs.map((g) => g.score))),
    subjects: subjects.sort((a, b) => fa(a.name, b.name)),
    timeline: Object.keys(byDate).sort().map((d) => ({ date: d, average: r2(mean(byDate[d])) })),
    attendance: att, insights,
  };
}

function route(m, seg, q, b) {
  const [res, id, sub] = seg;
  if (res === "students") {
    if (!id && m === "GET") {
      const term = (q.get("search") || "").trim(), cn = q.get("class_name"), sort = q.get("sort") || "name";
      let list = DB.students.filter((s) => (!term || [s.first_name, s.last_name, s.student_code].some((v) => v.includes(term))) && (!cn || s.class_name === cn)).map(stuOut);
      if (sort === "average") list.sort((a, c) => (a.average == null) - (c.average == null) || (c.average || 0) - (a.average || 0));
      else if (sort === "class") list.sort((a, c) => fa(a.class_name, c.class_name) || fa(a.last_name, c.last_name));
      else list.sort((a, c) => fa(a.last_name, c.last_name) || fa(a.first_name, c.first_name));
      return list;
    }
    if (!id && m === "POST") {
      const d = clean(b, STU);
      if (DB.students.some((s) => s.student_code === d.student_code)) bad("این کد دانش‌آموزی قبلاً ثبت شده است.");
      const s = { id: DB.next.s++, ...d }; DB.students.push(s); return stuOut(s);
    }
    if (id && !sub && m === "PUT") {
      const s = getStu(id), d = clean(b, STU);
      if (DB.students.some((x) => x.id !== s.id && x.student_code === d.student_code)) bad("این کد دانش‌آموزی قبلاً ثبت شده است.");
      Object.assign(s, d); return stuOut(s);
    }
    if (id && !sub && m === "DELETE") {
      const s = getStu(id);
      DB.students = DB.students.filter((x) => x !== s);
      DB.grades = DB.grades.filter((g) => g.student_id !== s.id);
      DB.attendance = DB.attendance.filter((a) => a.student_id !== s.id);
      return null;
    }
    if (id && sub === "report") return report(getStu(id));
  }
  if (res === "subjects") {
    if (m === "GET") return [...DB.subjects].sort((a, c) => fa(a.name, c.name));
    if (m === "POST") {
      const name = String(b.name || "").trim();
      if (!name) bad("نام درس الزامی است.");
      if (DB.subjects.some((s) => s.name === name)) bad("این درس قبلاً ثبت شده است.");
      const s = { id: DB.next.sub++, name }; DB.subjects.push(s); return s;
    }
  }
  if (res === "grades") {
    const gOut = (g) => ({ ...g, student_name: fullName(DB.students.find((s) => s.id === g.student_id)), subject_name: DB.subjects.find((s) => s.id === g.subject_id).name });
    if (!id && m === "GET") {
      const sid = +q.get("student_id") || 0, sb = +q.get("subject_id") || 0;
      return DB.grades.filter((g) => (!sid || g.student_id === sid) && (!sb || g.subject_id === sb))
        .sort((a, c) => c.exam_date.localeCompare(a.exam_date) || c.id - a.id).slice(0, 200).map(gOut);
    }
    if (!id && m === "POST") {
      getStu(b.student_id);
      if (!DB.subjects.some((s) => s.id === +b.subject_id)) bad("درس پیدا نشد.");
      const score = Number(b.score);
      if (b.score === "" || b.score == null || !Number.isFinite(score) || score < 0 || score > 20) bad("نمره باید عددی بین ۰ تا ۲۰ باشد.");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(b.exam_date || "")) bad("تاریخ معتبر نیست.");
      const g = { id: DB.next.g++, student_id: +b.student_id, subject_id: +b.subject_id, score, exam_date: b.exam_date, title: String(b.title || "").trim().slice(0, 100) };
      DB.grades.push(g); return gOut(g);
    }
    if (id && m === "DELETE") {
      if (!DB.grades.some((g) => g.id === +id)) bad("نمره پیدا نشد.");
      DB.grades = DB.grades.filter((g) => g.id !== +id); return null;
    }
  }
  if (res === "attendance") {
    if (m === "GET") {
      const day = q.get("day"), cn = q.get("class_name");
      return DB.attendance.filter((a) => (!day || a.day === day) && (!cn || DB.students.find((s) => s.id === a.student_id).class_name === cn))
        .map((a) => { const s = DB.students.find((x) => x.id === a.student_id); return { student_id: a.student_id, student_name: fullName(s), class_name: s.class_name, day: a.day, status: a.status }; });
    }
    if (m === "POST") {
      if (!b.day || !Array.isArray(b.records) || !b.records.length) bad("اطلاعات حضور و غیاب کامل نیست.");
      b.records.forEach((r) => { getStu(r.student_id); if (!["present", "late", "absent"].includes(r.status)) bad("وضعیت حضور معتبر نیست."); });
      b.records.forEach((r) => {
        const ex = DB.attendance.find((a) => a.student_id === +r.student_id && a.day === b.day);
        if (ex) ex.status = r.status; else DB.attendance.push({ id: DB.next.a++, student_id: +r.student_id, day: b.day, status: r.status });
      });
      return { saved: b.records.length, day: b.day };
    }
  }
  if (res === "analytics" && id === "summary") return summary();
  bad("مسیر نامعتبر است.");
}

async function api(path, opts = {}) {
  const [p, qs] = path.split("?");
  const out = route((opts.method || "GET").toUpperCase(), p.split("/").filter(Boolean), new URLSearchParams(qs || ""), opts.body || {});
  saveDB();
  return out == null ? null : JSON.parse(JSON.stringify(out));
}

const dshort = (d) => new Date(d + "T00:00:00").toLocaleDateString("fa-IR", { month: "short", day: "numeric" });
const dlong = (d) => new Date(d + "T00:00:00").toLocaleDateString("fa-IR", { year: "numeric", month: "long", day: "numeric" });

  toastTimer = setTimeout(() => (t.className = ""), 3200);
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

  });
}

const DIR = { up: "▲ رو به بهبود", down: "▼ کاهشی", flat: "ثابت", insufficient: "داده کافی نیست" };
async function report(id) {
  try {
    const r = await api(`/students/${id}/report`);
    const a = r.attendance;
    openDlg(`
    <div class="dlg-head"><div><h2>${esc(r.student.name)}</h2><small>${esc(r.student.class_name)} • پایه ${esc(r.student.grade_level)} • کد ${esc(r.student.student_code)}</small></div><button class="btn ghost sm" id="x">بستن</button></div>
    <div class="strip" style="grid-template-columns:repeat(3,1fr)">
      <div><span>معدل</span><b>${num(r.average)}</b></div>
      <div><span>درصد حضور</span><b>${a.rate == null ? "—" : num(a.rate) + "٪"}</b></div>
      <div><span>غیبت</span><b>${num(a.absent)}</b><em>${num(a.late)} تأخیر</em></div>
    </div>
    ${r.subjects.length ? `<div class="chartbox mt" style="height:230px"><canvas id="rc"></canvas></div>
    <table class="mt"><thead><tr><th>درس</th><th>میانگین</th><th>تعداد نمره</th><th>روند</th></tr></thead><tbody>
      ${r.subjects.map((x) => `<tr><td>${esc(x.name)}</td><td>${chip(x.average)}</td><td>${num(x.count)}</td><td>${DIR[x.direction]}</td></tr>`).join("")}</tbody></table>
    <h2 class="mt">یافته‌ها</h2>
    ${r.insights.length ? `<ul class="insights">${r.insights.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p>مورد قابل‌توجهی دیده نشد.</p>`}
    <p class="note mt">این یافته‌ها فقط بر پایه نمرات ثبت‌شده‌اند و پیش‌بینی قطعی از توانایی دانش‌آموز نیستند.</p>`
    : `<p class="empty">برای این دانش‌آموز هنوز نمره‌ای ثبت نشده است.</p>`}`);
    $("#x").onclick = closeDlg;
    if (r.subjects.length) {
      const labels = [...new Set(r.subjects.flatMap((s) => s.points.map((p) => p.date)))].sort();
      const palette = RAINBOW;
      dlgChart = new Chart($("#rc"), {
        type: "line",
        data: { labels: labels.map(dshort), datasets: r.subjects.map((s, i) => ({ label: s.name, borderColor: palette[i % 6], backgroundColor: palette[i % 6], tension: 0.25, spanGaps: true, pointRadius: 3, data: labels.map((d) => (s.points.find((p) => p.date === d) || {}).score ?? null) })) },
        options: { maintainAspectRatio: false, plugins: rtlPlugins, scales: { y: { min: 0, max: 20, ticks: { callback: (v) => nf.format(v) } } } },
      });
    }
  } catch (e) { toast(e.message, true); }
}

/* ---------- grades ---------- */
async function grades() {
  const [st, sb] = await Promise.all([api("/students?sort=name"), api("/subjects")]);
  const opts = (arr, f) => arr.map((x) => `<option value="${x.id}">${esc(f(x))}</option>`).join("");
  if (!st.length) { view.innerHTML = empty("ابتدا دانش‌آموز ثبت کنید."); return; }
  view.innerHTML = `
  <div class="panel">
    <h2>ثبت نمره جدید</h2>
    <form class="bar" id="gf">
      <label>دانش‌آموز<select name="student_id" required>${opts(st, (s) => `${s.last_name} ${s.first_name} (${s.class_name})`)}</select></label>
      <label>درس<select name="subject_id" id="gs" required>${opts(sb, (s) => s.name)}</select></label>
      <label>نمره (از ۲۰)<input name="score" type="number" min="0" max="20" step="0.25" required style="width:100px"></label>
      <label>تاریخ<input name="exam_date" type="date" value="${todayISO()}" required></label>
      <label>عنوان آزمون<input name="title" maxlength="100" placeholder="اختیاری"></label>
      <button class="btn" type="submit">ثبت نمره</button>
      <button class="btn ghost" type="button" id="ns">درس جدید</button>
    </form>
  </div>
  <div class="panel mt">
    <div class="bar">
      <label>فیلتر دانش‌آموز<select id="fst"><option value="">همه</option>${opts(st, (s) => `${s.last_name} ${s.first_name}`)}</select></label>
      <label>فیلتر درس<select id="fsb"><option value="">همه</option>${opts(sb, (s) => s.name)}</select></label>
    </div>
    <div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>دانش‌آموز</th><th>درس</th><th>عنوان</th><th>نمره</th><th></th></tr></thead><tbody id="gt"></tbody></table></div>
    <p class="note mt">آخرین ۲۰۰ نمره نمایش داده می‌شود.</p>
  </div>`;
  const load = guard(async () => {
    const p = new URLSearchParams();
    if ($("#fst").value) p.set("student_id", $("#fst").value);
    if ($("#fsb").value) p.set("subject_id", $("#fsb").value);
    const list = await api("/grades?" + p);
    $("#gt").innerHTML = list.length
      ? list.map((g) => `<tr><td>${dlong(g.exam_date)}</td><td>${esc(g.student_name)}</td><td>${esc(g.subject_name)}</td><td>${esc(g.title)}</td><td>${chip(g.score)}</td><td><button class="btn danger sm" data-del="${g.id}">حذف</button></td></tr>`).join("")
      : `<tr><td colspan="6" class="empty">نمره‌ای ثبت نشده است.</td></tr>`;
  });
  $("#fst").onchange = $("#fsb").onchange = load;
  $("#gf").onsubmit = guard(async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.student_id = +body.student_id; body.subject_id = +body.subject_id; body.score = +body.score;
    await api("/grades", { method: "POST", body });
    toast("نمره ثبت شد.");
    e.target.score.value = ""; e.target.title.value = "";
    load();
  });
  $("#gt").onclick = guard(async (e) => {
    const b = e.target.closest("[data-del]");
    if (!b || !confirm("این نمره حذف شود؟")) return;
    await api("/grades/" + b.dataset.del, { method: "DELETE" });
    toast("نمره حذف شد.");
    load();
  });
  $("#ns").onclick = () => {
    openDlg(`
    <div class="dlg-head"><h2>درس جدید</h2><button class="btn ghost sm" id="x">بستن</button></div>
    <form id="sbf"><label>نام درس<input id="sbn" required maxlength="60" placeholder="مثلاً شیمی" autofocus></label>
    <div class="actions"><button class="btn" type="submit">افزودن درس</button><button class="btn ghost" type="button" id="c">انصراف</button></div></form>`);
    $("#x").onclick = $("#c").onclick = closeDlg;
    $("#sbf").onsubmit = guard(async (e) => {
      e.preventDefault();
      const name = $("#sbn").value.trim();
      if (!name) return;
      const sub = await api("/subjects", { method: "POST", body: { name } });
      closeDlg();
      toast("درس «" + sub.name + "» اضافه شد.");
      $("#gs").insertAdjacentHTML("beforeend", `<option value="${sub.id}">${esc(sub.name)}</option>`);
      $("#gs").value = sub.id;
      $("#fsb").insertAdjacentHTML("beforeend", `<option value="${sub.id}">${esc(sub.name)}</option>`);
    });
  };
  await load();
}

/* ---------- attendance ---------- */
async function attendance() {
  const all = await api("/students?sort=class");
  if (!all.length) { view.innerHTML = empty("ابتدا دانش‌آموز ثبت کنید."); return; }
  const classes = [...new Set(all.map((s) => s.class_name))];
  view.innerHTML = `
  <div class="panel">
    <div class="bar">
      <label>کلاس<select id="ac">${classes.map((c) => `<option>${esc(c)}</option>`).join("")}</select></label>
      <label>تاریخ<input id="ad" type="date" value="${todayISO()}"></label>
      <span class="spacer"></span>
      <button class="btn ghost" id="allp">همه حاضر</button>
      <button class="btn" id="save">ذخیره حضور و غیاب</button>
    </div>
    <div class="tablewrap"><table><thead><tr><th>دانش‌آموز</th><th>وضعیت</th></tr></thead><tbody id="at"></tbody></table></div>
  </div>`;
  const load = guard(async () => {
    const cls = $("#ac").value, day = $("#ad").value;
    if (!day) return;
    const saved = Object.fromEntries((await api(`/attendance?day=${day}&class_name=${encodeURIComponent(cls)}`)).map((r) => [r.student_id, r.status]));
    $("#at").innerHTML = all.filter((s) => s.class_name === cls).map((s) => {
      const cur = saved[s.id] || "present";
      const r = (val, cls2, text) => `<label class="${cls2}"><input type="radio" name="s${s.id}" value="${val}" ${cur === val ? "checked" : ""}>${text}</label>`;
      return `<tr data-id="${s.id}"><td>${esc(s.last_name)} ${esc(s.first_name)}</td><td><div class="seg">${r("present", "p", "حاضر")}${r("late", "l", "تأخیر")}${r("absent", "a", "غایب")}</div></td></tr>`;
    }).join("");
  });
  $("#ac").onchange = $("#ad").onchange = load;
  $("#allp").onclick = () => document.querySelectorAll('#at input[value="present"]').forEach((i) => (i.checked = true));
  $("#save").onclick = guard(async () => {
    const records = [...document.querySelectorAll("#at tr")].map((tr) => ({ student_id: +tr.dataset.id, status: tr.querySelector("input:checked").value }));
    if (!records.length || !$("#ad").value) return toast("کلاس و تاریخ را انتخاب کنید.", true);
    await api("/attendance", { method: "POST", body: { day: $("#ad").value, records } });
    toast("حضور و غیاب ذخیره شد.");
  });
  await load();
}

</script>
